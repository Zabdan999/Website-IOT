<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cyberpunk IoT Dashboard - Builder Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0; font-family: 'Orbitron', monospace;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
      color: #00ffcc; display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 20px; box-sizing: border-box; overflow-x: hidden;
    }
    h1 {
      text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc; margin-bottom: 20px;
      font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-align: center;
    }
    
    /* PANELS & CARDS */
    .glass-panel {
      background: rgba(0, 0, 0, 0.4); padding: 15px; border: 1px solid #ff6b35;
      border-radius: 8px; box-shadow: 0 0 10px rgba(255, 107, 53, 0.2);
      width: 100%; max-width: 1200px; margin-bottom: 20px; position: relative;
    }
    .panel-blue { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0, 255, 204, 0.2); }
    .panel-header {
      font-weight: 700; letter-spacing: 1px; margin-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }

    /* INPUTS & CONTROLS */
    .input-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; width: 100%; }
    input, select {
      background: rgba(0, 255, 204, 0.05); border: 1px solid #00ffcc; color: #00ffcc;
      padding: 10px 15px; border-radius: 6px; font-family: 'Orbitron', monospace;
      outline: none; flex: 1; min-width: 150px;
    }
    select { cursor: pointer; }
    select option { background: #1a1a2e; color: #00ffcc; }
    input::placeholder { color: rgba(0, 255, 204, 0.4); }
    input:focus, select:focus { box-shadow: 0 0 10px #00ffcc; }
    
    button {
      border: 2px solid #00ffcc; background: rgba(0, 255, 204, 0.1); color: #00ffcc;
      padding: 10px 20px; cursor: pointer; border-radius: 6px; font-family: 'Orbitron', monospace;
      font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    button:hover:not(:disabled) { background: #00ffcc; color: #0f0f0f; box-shadow: 0 0 20px #00ffcc; }
    button:disabled { border-color: #555; color: #555; cursor: not-allowed; background: rgba(255,255,255,0.02); box-shadow: none;}
    .btn-sys { border-color: #ff6b35; color: #ff6b35; background: rgba(255, 107, 53, 0.1); }
    .btn-sys:hover:not(:disabled) { background: #ff6b35; color: #0f0f0f; box-shadow: 0 0 20px #ff6b35; }
    .btn-danger { border-color: #ef4444; color: #ef4444; }
    .btn-danger:hover:not(:disabled) { background: #ef4444; color: #000; box-shadow: 0 0 20px #ef4444;}
    .btn-icon { padding: 6px; border: none; background: transparent; font-size: 14px; opacity: 0.6;}
    .btn-icon:hover { background: transparent; opacity: 1; transform: scale(1.2); box-shadow: none;}

    /* STATUS STATUS */
    .status-badge {
      padding: 6px 12px; border-radius: 20px; font-size: 10px; font-weight: bold;
      border: 1px solid #555; color: #aaa; background: rgba(0,0,0,0.5); letter-spacing: 1px;
    }
    .status-badge.on { border-color: #00ff00; color: #00ff00; box-shadow: 0 0 10px rgba(0,255,0,0.3); }
    .status-badge.fb { border-color: #ff6b35; color: #ff6b35; box-shadow: 0 0 10px rgba(255,107,53,0.3); }

    /* DYNAMIC GRIDS */
    .dynamic-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; width: 100%;
    }
    .widget-card {
      border: 1px solid #00ffcc; border-radius: 12px; background: rgba(0, 255, 204, 0.03);
      padding: 15px; box-shadow: inset 0 0 20px rgba(0, 255, 204, 0.05); position: relative;
    }
    .widget-actions {
      position: absolute; top: 10px; right: 10px; display: flex; gap: 5px;
      opacity: 0; transition: opacity 0.3s;
    }
    .widget-card:hover .widget-actions { opacity: 1; }
    
    .widget-title { font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #fff; font-size: 14px;}
    .widget-value { font-size: 2.2em; font-weight: 900; text-shadow: 0 0 10px #00ffcc; margin: 10px 0; }
    
    .chart-box { height: 100px; width: 100%; margin-top: 10px; }
    .chart-box canvas { width: 100%; height: 100%; display: block; }

    /* SLIDER CYBERPUNK */
    input[type=range] {
      -webkit-appearance: none; width: 100%; background: transparent; margin-top: 15px;
    }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 6px; cursor: pointer; background: rgba(0, 255, 204, 0.2); border-radius: 3px; border: 1px solid #00ffcc;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 20px; width: 12px; border-radius: 2px; background: #00ffcc; cursor: pointer;
      -webkit-appearance: none; margin-top: -8px; box-shadow: 0 0 10px #00ffcc;
    }

    /* SWITCH CYBERPUNK */
    .switch-card { cursor: pointer; transition: all 0.3s; text-align: center; }
    .switch-card.active {
      background: rgba(0, 255, 204, 0.15); box-shadow: 0 0 20px rgba(0,255,204,0.4); border-color: #00ffcc;
    }
    .switch-card .widget-value { transition: all 0.3s; }
    .switch-card.active .widget-value { color: #00ffcc; text-shadow: 0 0 20px #00ffcc; }
    .switch-card:not(.active) .widget-value { color: #555; text-shadow: none; }

    /* LOGS */
    .log-panel {
      height: 200px; overflow-y: auto; font-family: 'Courier New', monospace;
      font-size: 12px; color: #ccc; background: rgba(0,0,0,0.6); border: 1px solid #333; padding: 10px; border-radius: 6px;
    }
    .log-panel::-webkit-scrollbar { width: 4px; }
    .log-panel::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 4px; }
    .log-line { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 2px; }
    .time { color: #888; margin-right: 5px; }
  </style>
</head>
<body>

  <h1>⚡ CYBER-IOT NEXUS</h1>

  <div class="glass-panel panel-blue">
    <div class="panel-header">
      <span style="color:#00ffcc"><i class="fas fa-network-wired"></i> CONNECTION UPLINK</span>
      <div style="display:flex; gap:10px;">
        <span class="status-badge" id="bleBadge">BLE: OFFLINE</span>
        <span class="status-badge" id="fbBadge">DB: OFFLINE</span>
      </div>
    </div>
    <div class="input-row" style="margin-bottom: 15px;">
      <input type="password" id="apiKeyInput" placeholder="API Key (AIzaSy...)">
      <input type="text" id="dbUrlInput" placeholder="Database URL (https://...)">
      <input type="text" id="dbPathInput" placeholder="Node Path (contoh: iot/kelas8)" value="iot/kelas8">
    </div>
    <div class="input-row justify-center">
      <button id="btnConnectFb" class="btn-sys"><i class="fas fa-cloud"></i> Connect Firebase</button>
      <button id="btnConnectBle"><i class="fab fa-bluetooth-b"></i> Connect Micro:bit</button>
      <button id="btnDisconnectBle" disabled><i class="fas fa-times"></i> Disconnect</button>
    </div>
  </div>

  <div class="glass-panel" id="builderPanel">
    <div class="panel-header" style="color:#ff6b35;">
      <span><i class="fas fa-tools"></i> WIDGET BUILDER</span>
      <button id="btnCancelEdit" class="btn-danger" style="display:none; padding:4px 10px; font-size:10px;">Batal Edit</button>
    </div>
    <div class="input-row">
      <input type="text" id="bKey" placeholder="Nama Key (ex: lampu_teras)">
      <select id="bType">
        <option value="sensor">📡 Chart Sensor (Analog Read)</option>
        <option value="switch">⚡ Toggle Switch (0/1)</option>
        <option value="dimmer">🎚️ Dimmer Slider (0-1024)</option>
      </select>
      <input type="text" id="bUnit" placeholder="Satuan (ex: °C, Lux)" style="flex:0.5">
      <input type="number" id="bMax" placeholder="Max Value (ex: 100/1024)" style="flex:0.5">
      <button id="btnSaveParam"><i class="fas fa-save"></i> SIMPAN</button>
    </div>
  </div>

  <div style="width: 100%; max-width: 1200px;">
    
    <h3 style="color:#fff; border-bottom: 1px solid #333; padding-bottom:10px;"><i class="fas fa-chart-line"></i> TELEMETRY SENSORS</h3>
    <div id="sensorGrid" class="dynamic-grid" style="margin-bottom: 30px;">
      <div style="grid-column: 1/-1; text-align:center; color:#555;">[ Sambungkan Database untuk memuat struktur ]</div>
    </div>

    <h3 style="color:#fff; border-bottom: 1px solid #333; padding-bottom:10px;"><i class="fas fa-gamepad"></i> CONTROL INTERFACE</h3>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom: 30px;">
      <div>
        <div style="color:#aaa; font-size:12px; margin-bottom:10px;">DIGITAL SWITCHES</div>
        <div id="switchGrid" class="dynamic-grid" style="grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));"></div>
      </div>
      <div>
        <div style="color:#aaa; font-size:12px; margin-bottom:10px;">ANALOG DIMMERS</div>
        <div id="dimmerGrid" style="display:flex; flex-direction:column; gap:15px;"></div>
      </div>
    </div>

  </div>

  <div class="glass-panel" style="border-color:#333;">
    <div class="panel-header" style="color:#888; font-size:12px;">
      <span><i class="fas fa-terminal"></i> SYSTEM TERMINAL</span>
      <button id="btnClearLog" style="padding:4px 8px; font-size:10px; border-color:#555; color:#aaa;"><i class="fas fa-trash"></i> CLEAR</button>
    </div>
    <div id="terminalLog" class="log-panel"></div>
  </div>


  <script type="module">
    import { initializeApp, getApps, deleteApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getDatabase, ref, onValue, update, remove, set } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // --- BLUETOOTH UUID ---
    const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_TX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_RX_CHARACTERISTIC_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    const state = {
      db: null, currentPath: "", unsubscribe: null, currentData: {}, historyData: {}, 
      device: null, txChar: null, rxChar: null, bleConnected: false, bleBuffer: "",
      editModeKey: null
    };

    const $ = (id) => document.getElementById(id);
    const formatName = (str) => str.replace(/_/g, ' ').toUpperCase();
    
    // --- TERMINAL LOGGER ---
    function logMsg(msg, color = "#ccc") {
      const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
      const html = `<div class="log-line"><span class="time">[${time}]</span> <span style="color:${color}">${msg}</span></div>`;
      $('terminalLog').insertAdjacentHTML('afterbegin', html);
    }

    // --- BLUETOOTH LOGIC ---
    async function connectBLE() {
      try {
        if (!navigator.bluetooth) throw new Error("Web Bluetooth tidak didukung browser ini.");
        logMsg("Scanning BLE devices...", "#ff6b35");
        
        state.device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: "BBC micro:bit" }],
          optionalServices: [UART_SERVICE_UUID]
        });
        
        state.device.addEventListener("gattserverdisconnected", () => {
          state.bleConnected = false; updateStatusUI(); logMsg("BLE Terputus!", "#ef4444");
        });

        const server = await state.device.gatt.connect();
        const service = await server.getPrimaryService(UART_SERVICE_UUID);
        
        state.txChar = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);
        state.rxChar = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);
        
        await state.txChar.startNotifications();
        state.txChar.addEventListener("characteristicvaluechanged", handleBLEData);
        
        state.bleConnected = true; updateStatusUI();
        logMsg(`Terhubung ke ${state.device.name}`, "#00ffcc");
      } catch (e) {
        logMsg(`BLE Error: ${e.message}`, "#ef4444");
      }
    }

    function handleBLEData(event) {
      let arr = [];
      for (let i = 0; i < event.target.value.byteLength; i++) arr.push(event.target.value.getUint8(i));
      state.bleBuffer += String.fromCharCode.apply(null, arr);
      
      const lines = state.bleBuffer.split('\n');
      state.bleBuffer = lines.pop(); 
      
      lines.forEach(line => {
        const txt = line.trim();
        if (txt) processIncomingSensor(txt);
      });
    }

    // --- INI BAGIAN YANG DISESUAIKAN (KECERDASAN OTOMATIS) ---
    function processIncomingSensor(txt) {
      logMsg(`RX < ${txt}`, "#00ffcc");
      if (!state.db) return;

      if (txt.includes(':')) {
        const parts = txt.split(':');
        let key = parts[0].trim().replace(/\s+/g, '_').toLowerCase();
        const val = parseFloat(parts[1].trim());

        // 1. SAMAKAN KATA KUNCI MODE 
        // Jika MakeCode kirim "mode:1", web ubah namanya jadi "otomatis" agar cocok dengan tombol
        if (key === "mode") key = "otomatis"; 

        // 2. TENTUKAN TIPE WIDGET OTOMATIS
        let autoType = "sensor"; // Defaultnya jadi grafik
        if (key === "lampu" || key === "otomatis") autoType = "switch"; // Lampu & Otomatis jadi tombol ON/OFF
        if (key === "kipas") autoType = "dimmer"; // Kipas jadi slider pengatur kecepatan

        if (!isNaN(val)) {
          if (state.currentData[key]) {
            // Update nilai yang ada di Firebase
            update(ref(state.db, `${state.currentPath}/${key}`), { value: val });
          } else {
            // Jika belum ada, buat widget secara cerdas!
            logMsg(`Auto-creating new ${autoType}: ${key}`, "#ff6b35");
            set(ref(state.db, `${state.currentPath}/${key}`), { 
                tipe: autoType, value: val, satuan: "", batas_atas: autoType==="dimmer"?1024:100 
            });
          }
        }
      }
    }
    // ---------------------------------------------------------

    async function sendToMicrobit(key, val) {
      if (!state.rxChar) { logMsg("Kirim gagal: BLE belum konek", "#ef4444"); return; }
      // Format ke MakeCode: "key,val\n"
      const payload = `${key},${val}\n`;
      try {
        await state.rxChar.writeValue(new TextEncoder().encode(payload));
        logMsg(`TX > ${payload.trim()}`, "#ff6b35");
      } catch(e) { logMsg(`TX Error: ${e.message}`, "#ef4444"); }
    }

    // --- FIREBASE LOGIC ---
    async function connectFirebase() {
      const apiKey = $('apiKeyInput').value.trim();
      const dbUrl = $('dbUrlInput').value.trim();
      const path = $('dbPathInput').value.trim();

      if(!apiKey || !dbUrl || !path) { alert("Lengkapi config Firebase!"); return; }
      
      try {
        const config = { apiKey, databaseURL: dbUrl, projectId: dbUrl.split('//')[1]?.split('.')[0] };
        
        const apps = getApps();
        if (apps.length > 0) await deleteApp(apps[0]);
        if (state.unsubscribe) state.unsubscribe();

        const app = initializeApp(config);
        state.db = getDatabase(app);
        state.currentPath = path;

        logMsg(`Syncing to DB: /${path}`, "#ff6b35");
        
        // Listener Real-time
        state.unsubscribe = onValue(ref(state.db, path), (snapshot) => {
          state.currentData = snapshot.val() || {};
          renderDashboard(state.currentData);
          
          $('fbBadge').innerText = "DB: SYNCED";
          $('fbBadge').classList.add('fb');
        });

        localStorage.setItem('cyber_builder_cfg', JSON.stringify({apiKey, dbUrl, path}));
      } catch(e) {
        logMsg(`DB Error: ${e.message}`, "#ef4444");
      }
    }

    // --- DASHBOARD RENDERER ---
    function renderDashboard(data) {
      const keys = Object.keys(data);
      if(keys.length === 0) {
        $('sensorGrid').innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#555;">[ Database Kosong. Tambah via Builder / Kirim data dari Micro:bit ]</div>`;
        $('switchGrid').innerHTML = ''; $('dimmerGrid').innerHTML = '';
        return;
      }

      const sensors = keys.filter(k => data[k].tipe === 'sensor');
      const switches = keys.filter(k => data[k].tipe === 'switch');
      const dimmers = keys.filter(k => data[k].tipe === 'dimmer');

      renderSensors(sensors, data);
      renderSwitches(switches, data);
      renderDimmers(dimmers, data);
    }

    function generateControlsHTML(key) {
      return `
        <div class="widget-actions">
          <button class="btn-icon" style="color:#00ffcc;" onclick="editParam('${key}')"><i class="fas fa-edit"></i></button>
          <button class="btn-icon" style="color:#ef4444;" onclick="deleteParam('${key}')"><i class="fas fa-trash"></i></button>
        </div>
      `;
    }

    function renderSensors(keys, data) {
      const grid = $('sensorGrid');
      Array.from(grid.children).forEach(el => { if(el.id && !keys.includes(el.id.replace('s-',''))) el.remove(); });
      if(keys.length > 0 && grid.innerHTML.includes("Database Kosong")) grid.innerHTML = '';

      keys.forEach(key => {
        const item = data[key];
        let card = $(`s-${key}`);
        
        if(!state.historyData[key]) state.historyData[key] = [];
        state.historyData[key].push(item.value);
        if(state.historyData[key].length > 30) state.historyData[key].shift();

        if (!card) {
          const html = `
            <div class="widget-card" id="s-${key}">
              ${generateControlsHTML(key)}
              <div class="widget-title">${formatName(key)}</div>
              <div style="display:flex; align-items:baseline; gap:5px;">
                <div class="widget-value" id="s-val-${key}">${item.value}</div>
                <div style="color:#00ffcc; font-size:12px;">${item.satuan || ''}</div>
              </div>
              <div class="chart-box"><canvas id="canvas-${key}"></canvas></div>
            </div>
          `;
          grid.insertAdjacentHTML('beforeend', html);
        } else {
          $(`s-val-${key}`).innerText = item.value;
        }
        drawCanvasChart(key, state.historyData[key], item.batas_atas || 1024);
      });
    }

    function renderSwitches(keys, data) {
      const grid = $('switchGrid');
      grid.innerHTML = '';
      keys.forEach(key => {
        const item = data[key];
        const isOn = (item.value == 1 || item.value === true);
        
        const html = `
          <div class="widget-card switch-card ${isOn ? 'active' : ''}" id="sw-${key}" onclick="toggleSwitch('${key}', ${isOn ? 0 : 1})">
            ${generateControlsHTML(key)}
            <i class="fas fa-power-off" style="font-size:24px; margin-bottom:10px; color:${isOn ? '#00ffcc' : '#555'}"></i>
            <div class="widget-title">${formatName(key)}</div>
            <div class="widget-value" style="font-size:1.5em; margin-top:5px;">${isOn ? 'ON' : 'OFF'}</div>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', html);
      });
    }

    function renderDimmers(keys, data) {
      const grid = $('dimmerGrid');
      grid.innerHTML = '';
      keys.forEach(key => {
        const item = data[key];
        const max = item.batas_atas || 1024;
        
        const html = `
          <div class="widget-card" style="padding:10px 15px;">
            ${generateControlsHTML(key)}
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
               <div class="widget-title">${formatName(key)}</div>
               <div style="color:#00ffcc; font-weight:bold;">${item.value} <span style="color:#555;font-size:10px;">/ ${max}</span></div>
            </div>
            <input type="range" min="0" max="${max}" value="${item.value}" onchange="changeDimmer('${key}', this.value)">
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', html);
      });
    }

    function drawCanvasChart(key, values, maxConfig) {
      const cvs = $(`canvas-${key}`);
      if(!cvs) return;
      const ctx = cvs.getContext('2d');
      const w = cvs.width, h = cvs.height;
      ctx.clearRect(0,0,w,h);
      if(values.length < 2) return;

      const maxVal = Math.max(...values, 10);
      const max = Math.max(maxVal + (maxVal*0.1), maxConfig/2); 
      const pad = 4;
      const plotW = w - pad*2; const plotH = h - pad*2;
      const step = plotW / (values.length - 1);

      ctx.beginPath();
      values.forEach((v, i) => {
        const x = pad + i*step; const y = pad + plotH - ((v/max)*plotH);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.lineTo(pad+plotW, pad+plotH); ctx.lineTo(pad, pad+plotH);
      ctx.closePath();
      ctx.fillStyle = "rgba(0, 255, 204, 0.15)"; ctx.fill();

      ctx.beginPath();
      values.forEach((v, i) => {
        const x = pad + i*step; const y = pad + plotH - ((v/max)*plotH);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.strokeStyle = "#00ffcc"; ctx.lineWidth = 2; ctx.stroke();
    }

    window.toggleSwitch = async (key, newVal) => {
      await update(ref(state.db, `${state.currentPath}/${key}`), { value: newVal });
      sendToMicrobit(key, newVal);
    };

    window.changeDimmer = async (key, newVal) => {
      await update(ref(state.db, `${state.currentPath}/${key}`), { value: parseInt(newVal) });
      sendToMicrobit(key, parseInt(newVal));
    };

    window.deleteParam = async (key) => {
      if(confirm(`Hapus parameter [${key}] dari database?`)) {
        await remove(ref(state.db, `${state.currentPath}/${key}`));
        if(state.historyData[key]) delete state.historyData[key];
        logMsg(`Deleted: ${key}`, "#ef4444");
      }
    };

    window.editParam = (key) => {
      const item = state.currentData[key];
      if(!item) return;
      $('bKey').value = key; $('bKey').readOnly = true; $('bKey').style.borderColor = "#ff6b35";
      $('bType').value = item.tipe || 'sensor';
      $('bUnit').value = item.satuan || '';
      $('bMax').value = item.batas_atas || '';
      
      state.editModeKey = key;
      $('btnCancelEdit').style.display = 'inline-block';
      $('btnSaveParam').innerHTML = '<i class="fas fa-check"></i> UPDATE';
    };

    function resetBuilder() {
      $('bKey').value = ''; $('bKey').readOnly = false; $('bKey').style.borderColor = "#00ffcc";
      $('bUnit').value = ''; $('bMax').value = '';
      state.editModeKey = null;
      $('btnCancelEdit').style.display = 'none';
      $('btnSaveParam').innerHTML = '<i class="fas fa-save"></i> SIMPAN';
    }
    $('btnCancelEdit').onclick = resetBuilder;

    $('btnSaveParam').onclick = async () => {
      if(!state.db) { alert("Konek Firebase dulu!"); return; }
      let key = $('bKey').value.trim().replace(/\s+/g, '_').toLowerCase();
      if(!key) return;

      const payload = {
        tipe: $('bType').value,
        satuan: $('bUnit').value.trim(),
        batas_atas: parseInt($('bMax').value) || ($('bType').value === 'dimmer'? 1024 : 100),
        value: state.editModeKey ? state.currentData[state.editModeKey].value : 0
      };

      try {
        await set(ref(state.db, `${state.currentPath}/${key}`), payload);
        logMsg(`Saved Param: ${key}`, "#00ffcc");
        resetBuilder();
      } catch(e) { logMsg(`Save Error: ${e.message}`, "#ef4444"); }
    };

    function updateStatusUI() {
      $('btnConnectBle').disabled = state.bleConnected;
      $('btnDisconnectBle').disabled = !state.bleConnected;
      const b = $('bleBadge');
      if(state.bleConnected) { b.innerText = "BLE: ONLINE"; b.classList.add('on'); }
      else { b.innerText = "BLE: OFFLINE"; b.classList.remove('on'); }
    }

    $('btnConnectBle').onclick = connectBLE;
    $('btnDisconnectBle').onclick = () => { if(state.device) state.device.gatt.disconnect(); };
    $('btnConnectFb').onclick = connectFirebase;
    $('btnClearLog').onclick = () => $('terminalLog').innerHTML = '';

    window.onload = () => {
      const saved = JSON.parse(localStorage.getItem('cyber_builder_cfg') || '{}');
      if(saved.apiKey) {
        $('apiKeyInput').value = saved.apiKey;
        $('dbUrlInput').value = saved.dbUrl;
        $('dbPathInput').value = saved.path;
      }
      logMsg("SISTEM SIAP. Menunggu instruksi...", "#888");
    };

  </script>
</body>
</html>
